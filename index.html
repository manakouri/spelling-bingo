<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bingo</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo="> <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .word-card { transition: all 0.3s ease; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div id="app" class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="text-center mb-8 no-print">
            <h1 class="text-5xl font-black text-indigo-600 mb-2">Spelling Bingo</h1>
            <p class="text-slate-600 text-lg">Select patterns, generate your list, and play!</p>
            <button onclick="goHome()" class="no-print fixed top-4 right-4 z-50 p-3 bg-white border border-slate-200 rounded-full shadow-lg hover:bg-slate-50 transition-all text-slate-600 group" title="Return to Setup">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
    </svg>
</button>
        </header>

        <section id="setup-section" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 no-print">
            <h2 class="text-xl font-semibold mb-6 flex items-center">
                <span class="bg-indigo-100 text-indigo-700 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">1</span>
                Setup Game
            </h2>
            
            <div class="mb-8">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">Choose Patterns:</h3>
                <div id="pattern-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    </div>
            </div>

            <div class="mb-8 border-t pt-6">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">Grid Size (Pool Size):</h3>
                <div class="flex gap-6">
                    <label class="flex items-center cursor-pointer group">
                        <input type="radio" name="gridSize" value="20" class="w-5 h-5 text-indigo-600">
                        <span class="ml-2 text-lg group-hover:text-indigo-600 transition">3x3 Grid (20 Words)</span>
                    </label>
                    <label class="flex items-center cursor-pointer group">
                        <input type="radio" name="gridSize" value="40" checked class="w-5 h-5 text-indigo-600">
                        <span class="ml-2 text-lg group-hover:text-indigo-600 transition">4x4 Grid (40 Words)</span>
                    </label>
                </div>
            </div>

            <button onclick="generateWordPool()" class="w-full md:w-auto px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xl rounded-xl shadow-lg transition transform active:scale-95">
                Generate Word List
            </button>
        </section>

        <section id="list-section" class="hidden bg-white p-6 rounded-xl shadow-sm border-2 border-indigo-100 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 no-print">
                <div>
                    <h2 class="text-3xl font-bold text-slate-800">Student Word Pool</h2>
                    <p class="text-lg text-slate-500 mt-1">Students: Choose your words from this list for your grid.</p>
                </div>
                <button onclick="startGame()" class="mt-4 md:mt-0 px-8 py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xl rounded-xl shadow-lg transition">
                    Start Calling Words →
                </button>
            </div>
            
            <div id="word-pool-display" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3 border-t pt-6">
                </div>
        </section>

        <section id="game-section" class="hidden grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3 bg-white p-12 rounded-2xl shadow-xl border-4 border-indigo-100 text-center">
                <div class="mb-4 text-indigo-400 font-mono text-xl uppercase tracking-widest" id="counter">Word 0 / 0</div>
                <div id="current-word" class="text-7xl md:text-9xl font-black text-slate-800 my-12 min-h-[160px] flex items-center justify-center tracking-tight lowercase">
                    ready?
                </div>
                <button id="next-btn" onclick="drawNextWord()" class="px-12 py-6 bg-indigo-600 hover:bg-indigo-700 text-white text-3xl font-bold rounded-2xl shadow-lg transform active:scale-95 transition">
                    Next Word
                </button>
            </div>

            <div class="bg-slate-800 rounded-2xl p-6 text-white shadow-xl">
                <h3 class="text-xl font-bold mb-4 pb-2 border-b border-slate-700 text-indigo-300">History</h3>
                <ul id="history-list" class="space-y-2 max-h-[500px] overflow-y-auto pr-2 text-xl lowercase">
                    <li class="text-slate-500 italic text-sm normal-case">No words called yet...</li>
                </ul>
            </div>
        </section>
    </div>

    <script>
        const spellingData = [
            { id: "s3a", title: "Short 'a'", words: ["cat", "map", "fan", "sad", "bag", "apple", "ant", "catch", "magic", "fantastic", "habit", "jacket", "magnet", "rabbit", "sandal", "banner", "cabin", "dragon", "gallon", "planet", "stamp", "batter", "clapper", "mansion"] },
            { id: "s3e", title: "Short 'e'", words: ["bed", "ten", "red", "leg", "pen", "tent", "best", "seven", "letter", "empty", "better", "helmet", "melon", "never", "pebble", "second", "velvet", "yellow", "kettle", "dental", "fender", "lesson", "member", "sender"] },
            { id: "s3i", title: "Short 'i'", words: ["bit", "sit", "pin", "rim", "win", "lid", "hip", "tin", "dig", "inside", "invite", "insect", "simple", "sister", "finish", "limit", "minute", "village", "visit", "picnic", "window", "kitchen", "cabin", "ticket"] },
            { id: "s3o", title: "Short 'o'", words: ["hot", "dog", "log", "mop", "pot", "clock", "shop", "orange", "bottle", "common", "pocket", "bonnet", "cotton", "doctor", "fossil", "goblet", "hobby", "modern", "problem", "rocket", "bottom", "closet", "gossip", "rotten"] },
            { id: "s3u", title: "Short 'u'", words: ["cup", "mug", "run", "sun", "cut", "hug", "mud", "luck", "pup", "supper", "under", "bucket", "puppet", "sunset", "butter", "muffin", "subject", "button", "bubble", "clutter", "mumble", "number", "rubber", "summer"] },
            { id: "s3sh", title: "Digraph 'sh'", words: ["ship", "shop", "fish", "she", "shut", "crash", "fresh", "shadow", "finish", "shrimp", "brush", "splash", "punish", "vanish", "selfish", "radish", "shutter", "sheriff", "shallow", "publish", "shell", "shout", "flash", "shock"] },
            { id: "s3ch", title: "Digraph 'ch'", words: ["chin", "chop", "much", "rich", "chick", "lunch", "teacher", "kitchen", "bench", "munch", "punch", "chess", "check", "chicken", "channel", "chatter", "chunky", "chestnut", "ketchup", "munchkin", "chip", "chat", "cherry", "chug"] },
            { id: "s3th", title: "Digraph 'th'", words: ["this", "that", "then", "with", "bath", "three", "thank", "brother", "thin", "thick", "moth", "cloth", "path", "think", "north", "south", "fifth", "bathtub", "nothing", "thumb", "math", "breath", "depth"] },
            { id: "s3wh", title: "Digraph 'wh'", words: ["what", "when", "why", "wheel", "whip", "white", "whale", "whistle", "which", "whisper", "whisk", "whack", "wheat", "while", "whim", "whine", "whirl", "whiskers", "whiskey", "whopper", "whimper", "whiff"] },
            { id: "s3ph", title: "Digraph 'ph'", words: ["phone", "photo", "dolphin", "alphabet", "graph", "nephew", "phantom", "phrase", "trophy", "sphere", "orphan", "phonics", "phase", "phobia", "physical", "prophet", "nephew", "paragraph", "siphon", "triumph"] },
            { id: "s3ck", title: "Digraph '-ck'", words: ["duck", "sock", "kick", "black", "clock", "chick", "rocket", "pocket", "jacket", "bucket", "ticket", "locker", "packer", "picket", "racket", "socket", "tucker", "wicked", "quacker", "snack"] },
            { id: "s3dge", title: "The '-dge' Pattern", words: ["badge", "edge", "bridge", "fudge", "judge", "ledge", "dodge", "nudge", "wedge", "knowledge", "fridge", "dislodge", "pledge", "sludge", "grudge", "bridge", "cartridge", "partridge", "sledge", "trudge"] },
            { id: "s3tch", title: "The '-tch' Pattern", words: ["catch", "match", "witch", "pitch", "hatch", "scratch", "fetch", "unlatch", "dispatch", "rewatch", "rematch", "sketchbook", "mismatch", "crosshatch", "sketch", "stretch", "clutch", "crutch", "snatch", "switch"] },
            { id: "s3fl", title: "The Floss Rule", words: ["puff", "hill", "mess", "buzz", "fluff", "spell", "kiss", "fizz", "staff", "will", "glass", "shell", "cliff", "doll", "dress", "grass", "less", "miss", "off", "stiff", "well", "boss", "sniff", "jazz"] },
            { id: "s3ai", title: "The 'ai' Pattern", words: ["rain", "train", "paid", "wait", "paint", "brain", "afraid", "explain", "mail", "sail", "tail", "chain", "drain", "grain", "snail", "stain", "claim", "raise", "praise", "complain"] },
            { id: "s3ay", title: "The 'ay' Pattern", words: ["day", "play", "may", "say", "way", "stay", "today", "always", "Sunday", "clay", "gray", "pray", "tray", "sway", "delay", "display", "holiday", "birthday", "anyway", "payment"] },
            { id: "s3ou", title: "The 'ou' Pattern", words: ["out", "shout", "cloud", "scout", "found", "mouth", "couch", "around", "about", "without", "surround", "announce", "encounter", "amount", "bounce", "ground", "house", "mouse", "pound", "sound", "south", "proud"] },
            { id: "s3ae", title: "Magic 'a_e'", words: ["cake", "make", "same", "game", "late", "snake", "mistake", "escape", "brave", "plate", "grape", "shake", "whale", "chase", "amaze", "became", "behave", "awake", "state", "plane"] },
            { id: "s3ie", title: "Magic 'i_e'", words: ["bike", "like", "time", "nine", "five", "slide", "inside", "invite", "drive", "prize", "smile", "white", "write", "quite", "arrive", "decide", "polite", "ignite", "beside", "sunrise"] },
            { id: "s3oe", title: "Magic 'o_e'", words: ["home", "bone", "rope", "note", "spoke", "alone", "explode", "broke", "close", "hole", "hope", "stone", "those", "vote", "woke", "smoke", "stroke", "remote", "suppose", "phone"] },
            { id: "s3ue", title: "Magic 'u_e'", words: ["cube", "huge", "june", "flute", "rude", "excuse", "use", "mule", "rule", "tune", "tube", "amuse", "refuse", "volume", "produce", "assume", "fortune", "costume", "compute", "include"] },
            { id: "s3ee", title: "Magic 'e_e'", words: ["these", "theme", "complete", "athlete", "concrete", "extreme", "gene", "delete", "trapeze", "stampede", "obsolete", "convene", "sincere", "interfere"] },
            { id: "s3con", title: "Contractions (Basic)", words: ["i'm", "he's", "what's", "when's", "we're", "they're", "it's", "she's", "there's", "who's", "you're", "can't", "don't", "won't", "isn't", "wasn't", "aren't", "weren't", "haven't", "hasn't"] },
            { id: "s3ed", title: "Past Tense '-ed'", words: ["looked", "jumped", "watched", "laughed", "dropped", "missed", "called", "played", "cleaned", "lived", "opened", "loved", "wanted", "needed", "folded", "started", "helped", "asked", "showed", "talked"] },
            { id: "s3dbl", title: "CVC Doubling", words: ["shopping", "robber", "mopped", "tripping", "stepped", "fitting", "wetter", "running", "clapping", "bigger", "hottest", "nodded", "hidden", "batter", "patted", "rubbing", "sitting", "swimming", "winner", "begged"] },
            { id: "s4oi", title: "The 'oi' Pattern", words: ["oil", "boil", "coin", "soil", "foil", "coil", "join", "boiling", "appoint", "rejoice", "disjointed", "ointment", "spoiler", "turmoil", "point", "avoid", "noise", "choice", "voice", "moist"] },
            { id: "s4oy", title: "The 'oy' Pattern", words: ["boy", "toy", "joy", "soy", "coy", "ploy", "cloy", "enjoy", "destroy", "annoy", "employee", "royalty", "voyage", "cowboy", "joyful", "annoying", "loyal", "oyster", "deploy", "enjoyment"] },
            { id: "s4oa", title: "The 'oa' Pattern", words: ["boat", "coat", "goat", "moan", "load", "groan", "toad", "boating", "floating", "coating", "approach", "soapbox", "roadway", "roast", "toast", "oak", "soak", "foam", "loaf", "cloak"] },
            { id: "s4ow_o", title: "The 'ow' (long o)", words: ["snow", "grow", "low", "tow", "row", "show", "blow", "window", "yellow", "shallow", "elbow", "pillow", "shadow", "hollow", "flow", "mow", "slow", "arrow", "below", "narrow"] },
            { id: "s4ow_ou", title: "The 'ow' (ou sound)", words: ["cow", "now", "how", "brown", "town", "clown", "power", "flower", "towel", "crown", "frown", "growl", "allow", "crowd", "powder", "shower", "tower", "down", "owl", "vowel"] },
            { id: "s4ar", title: "The 'ar' Pattern", words: ["car", "star", "far", "dark", "park", "shark", "smart", "party", "artist", "garden", "market", "arm", "barn", "card", "hard", "yard", "march", "start", "alarm", "harvest"] },
            { id: "s4er", title: "The 'er/ur/ir' Pattern", words: ["her", "term", "hammer", "summer", "teacher", "fur", "turn", "nurse", "purple", "further", "bird", "stir", "thirty", "shirt", "skirt", "clerk", "person", "burn", "church", "first", "third", "birthday", "twirl", "curb"] },
            { id: "s4or", title: "The 'or' Pattern", words: ["fork", "storm", "corn", "port", "short", "sport", "born", "corner", "morning", "important", "report", "explore", "forget", "portion", "horse", "north", "orbit", "order", "shore", "snore"] },
            { id: "s4ck", title: "The 'c/k' Rule", words: ["cat", "cup", "cold", "coat", "can", "carrot", "candle", "kite", "kick", "kitten", "key", "king", "kept", "kind", "cabin", "candy", "cook", "kiss", "kept", "skill"] },
            { id: "s4ly", title: "Suffix '-ly'", words: ["slowly", "quickly", "loudly", "softly", "happily", "sadly", "bravely", "kindly", "neatly", "calmly", "daily", "fairly", "gladly", "mainly", "mostly", "nearly", "proudly", "safely", "simply", "weekly"] },
            { id: "s5ew", title: "The 'ew' Pattern", words: ["new", "few", "blew", "crew", "stew", "chew", "grew", "review", "interview", "preview", "renewal", "curfew", "overview", "drew", "flew", "knew", "screw", "view", "nephew", "cashew"] },
            { id: "s5y_i", title: "The 'y' (long i)", words: ["try", "shy", "cry", "fly", "spy", "spry", "by", "dry", "ply", "my", "why", "fry", "sky", "sly", "pry", "rely", "deny", "apply", "reply", "supply"] },
            { id: "s5y_e", title: "The 'y' (long e)", words: ["happy", "funny", "sunny", "silly", "grumpy", "windy", "puppy", "candy", "family", "body", "lady", "empty", "ready", "hungry", "baby", "city", "copy", "dirty", "every", "lucky"] },
            { id: "s5le", title: "The '-le' Pattern", words: ["apple", "candle", "table", "bubble", "simple", "jungle", "giggle", "tickle", "cradle", "puzzle", "bottle", "rattle", "uncle", "beetle", "middle", "little", "handle", "puddle", "single", "stable"] },
            { id: "s5soft", title: "Soft 'c' (s)", words: ["cell", "cent", "ice", "race", "face", "lace", "mice", "city", "pencil", "circus", "cycle", "centre", "recent", "decide", "twice", "nice", "slice", "price", "voice", "dance"] },
            { id: "s6kn", title: "Silent 'kn'", words: ["know", "knife", "knight", "knee", "knock", "knot", "kneel", "knelt", "knob", "knit", "knives", "knapsack", "knead", "knickers", "knave", "knobby", "knuckle", "kneecap", "knoll", "knick-knack"] },
            { id: "s6wr", title: "Silent 'wr'", words: ["write", "wrong", "wrap", "wreck", "wrist", "wrestle", "wreath", "wrench", "wring", "wrinkle", "wristband", "writer", "writing", "wrongly", "wrought", "wrath", "wreckage", "wretched"] },
            { id: "s6mb", title: "Silent 'mb'", words: ["lamb", "comb", "thumb", "climb", "bomb", "crumb", "dumb", "numb", "plumber", "limb", "tomb", "debtor", "doubt", "subtle", "aplomb", "catacomb", "succumb"] },
            { id: "s6tion", title: "Suffix '-tion'", words: ["action", "nation", "station", "lotion", "motion", "option", "education", "information", "addition", "attention", "condition", "direction", "fraction", "mention", "position", "section", "vacation", "invention", "caption", "caution"] },
            { id: "s6mis", title: "Prefix 'mis-'", words: ["misbehave", "mistake", "misunderstand", "misspell", "misplace", "mislead", "misfit", "misuse", "miscount", "misread", "mismatch", "misfortune", "misjudge", "misprint", "misstep", "mistrust", "misdeed", "mislabel"] }
        ];

        let selectedPool = [];
        let gameQueue = [];
        let history = [];
        let maxPoolSize = 40;

        function init() {
            const grid = document.getElementById('pattern-grid');
            spellingData.forEach(pattern => {
                const label = document.createElement('label');
                label.className = "flex items-center p-3 bg-slate-50 border rounded-lg cursor-pointer hover:bg-indigo-50 transition";
                label.innerHTML = `
                    <input type="checkbox" class="pattern-check w-4 h-4 text-indigo-600" value="${pattern.id}">
                    <span class="ml-3 font-medium text-sm text-slate-700">${pattern.title}</span>
                `;
                grid.appendChild(label);
            });
        }

        function generateWordPool() {
            const checked = Array.from(document.querySelectorAll('.pattern-check:checked')).map(cb => cb.value);
            if (checked.length < 1) return alert("Please select at least one pattern!");

            const poolSize = parseInt(document.querySelector('input[name="gridSize"]:checked').value);
            maxPoolSize = poolSize;

            let allAvailableWords = [];
            spellingData.forEach(p => {
                if (checked.includes(p.id)) {
                    allAvailableWords = [...allAvailableWords, ...p.words];
                }
            });

            // Randomize and slice
            selectedPool = allAvailableWords
                .map(w => w.toLowerCase())
                .sort(() => 0.5 - Math.random())
                .slice(0, poolSize);
            
            // Safety check if pool is small
            if (selectedPool.length < poolSize) {
                alert(`Note: Only ${selectedPool.length} words found for these patterns.`);
            }

            const displayPool = [...selectedPool].sort();
            const container = document.getElementById('word-pool-display');
            
            container.innerHTML = displayPool.map(w => `
                <div class="p-4 border border-slate-200 rounded-lg text-center text-xl md:text-2xl bg-slate-50 lowercase font-bold text-slate-700 shadow-sm leading-tight">
                    ${w}
                </div>
            `).join('');
            
            document.getElementById('list-section').classList.remove('hidden');
            document.getElementById('list-section').scrollIntoView({behavior: 'smooth'});
        }

        function startGame() {
            gameQueue = [...selectedPool].sort(() => 0.5 - Math.random());
            history = [];
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('list-section').classList.add('no-print');
            document.getElementById('game-section').classList.remove('hidden');
            
            // Reset Caller UI
            document.getElementById('current-word').innerText = "ready?";
            document.getElementById('counter').innerText = `word 0 / ${maxPoolSize}`;
            document.getElementById('history-list').innerHTML = `<li class="text-slate-500 italic text-sm normal-case">No words called yet...</li>`;
            document.getElementById('next-btn').disabled = false;
            
            document.getElementById('game-section').scrollIntoView({behavior: 'smooth'});
        }

        function drawNextWord() {
            if (gameQueue.length === 0) {
                document.getElementById('current-word').innerText = "game over!";
                document.getElementById('next-btn').disabled = true;
                return;
            }

            const word = gameQueue.pop();
            history.unshift(word);
            
            document.getElementById('current-word').innerText = word;
            document.getElementById('counter').innerText = `word ${history.length} / ${maxPoolSize}`;
            
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = history.map((w, i) => `
                <li class="flex items-center">
                    <span class="text-indigo-400 font-mono text-xs mr-3">${history.length - i}.</span>
                    ${w}
                </li>
            `).join('');
        }

        // Run on load
        init();
    </script>
</body>
</html>
